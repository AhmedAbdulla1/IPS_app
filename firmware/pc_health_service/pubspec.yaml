name: pc_health_service
description: >
  خدمة PC محلية بتقرأ بيانات صحة النودز من ESP32 Mesh Root عبر Serial/USB
  وتعرضها في داشبورد محلي (نافذة متصفح مستقلة على localhost) - مفيش
  أي رفع لـSupabase حاليًا (قرار 2026-09-12، راجع MESH_PROGRESS.md).
  شايفة تفاصيل البروتوكول في ../MESH_DESIGN.md.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # FFI bindings لـlibserialport - بتدعم Windows/Linux/macOS.
  # TODO: بعد أول `dart pub get` تأكد من رقم النسخة الفعلي المتاح على
  # pub.dev وثبّته هنا (النسخة هنا افتراضية وقت الكتابة).
  libserialport: ^0.4.0
  http: ^1.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
